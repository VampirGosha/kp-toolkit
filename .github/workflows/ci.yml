name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: pip install -e .

      # Браузеры Playwright не ставятся — настоящий `kp pull` требует
      # живого аккаунта Кинопоиска и браузера, это локальная операция.
      - name: Smoke check (import + CLI)
        run: |
          python -c "import kp_toolkit; print(kp_toolkit.__version__)"
          kp --help
          kp pull --help
          kp report --help