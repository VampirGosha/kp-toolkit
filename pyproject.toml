[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kp-toolkit"
version = "1.0.0"
description = "Экспорт и анализ твоей библиотеки Кинопоиска"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["kinopoisk", "playwright", "movie-analysis", "movie-statistics", "cli", "llm"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "playwright>=1.55",
]

[project.scripts]
kp = "kp_toolkit.cli:main"

[tool.setuptools]
packages = ["kp_toolkit"]